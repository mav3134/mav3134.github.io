name: Update draft room rankings

on:
  schedule:
    # 11:20 UTC daily = 7:20am ET (6:20am during standard time)
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh rankings from FantasyPros
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: node scripts/update-draft-rankings.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Rankings unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily draft room rankings update ($(date -u +%Y-%m-%d))"
          git push
